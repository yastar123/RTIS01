<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var realFetch = window.fetch;
          var customFetch = null;
          function getFetch() {
            return customFetch || realFetch;
          }
          function setFetch(val) {
            customFetch = val;
          }

          var targets = [Window.prototype, window];
          for (var i = 0; i < targets.length; i++) {
            try {
              var t = targets[i];
              if (t) {
                Object.defineProperty(t, "fetch", {
                  get: getFetch,
                  set: setFetch,
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e) {
              // ignore
            }
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rumah sehat tradisional Chinese medicine dengan layanan terapi holistik."
    />
    <title>Rumah Terapy Ikhtiar Sehat — Klinik TCM</title>
    <link rel="icon" href="/logon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
